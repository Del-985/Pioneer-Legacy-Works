name: Admin Frontend Build

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "public/**"
      - "scripts/create-spa-fallback.mjs"
      - ".env.admin"
      - "package.json"
      - "vite.config.ts"
      - "tsconfig*.json"
      - ".github/workflows/admin-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install dependencies
        run: npm install

      - name: Build standalone admin
        run: npm run build:admin

      - name: Verify Pages fallback
        run: test -f dist/index.html && test -f dist/404.html
