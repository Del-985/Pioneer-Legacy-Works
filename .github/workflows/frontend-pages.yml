name: Deploy frontend to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "public/**"
      - "scripts/**"
      - "index.html"
      - "package.json"
      - "tsconfig*.json"
      - "vite.config.*"
      - ".env.production"
      - ".github/workflows/frontend-pages.yml"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build frontend
        run: npm run build

      - name: Add SPA fallback
        run: npm run pages:fallback

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Wait for legacy Pages publisher
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          legacy_run_id="$(
            curl --fail --silent --show-error \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${GITHUB_SHA}&per_page=20" \
            | jq -r '.workflow_runs[] | select(.path == "dynamic/pages/pages-build-deployment") | .id' \
            | head -n 1
          )"

          if [ -z "${legacy_run_id}" ]; then
            echo "No legacy Pages run found for this commit."
            exit 0
          fi

          echo "Waiting for legacy Pages run ${legacy_run_id} before deploying compiled assets."

          for attempt in $(seq 1 60); do
            status="$(
              curl --fail --silent --show-error \
                --header "Accept: application/vnd.github+json" \
                --header "Authorization: Bearer ${GH_TOKEN}" \
                --header "X-GitHub-Api-Version: 2022-11-28" \
                "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${legacy_run_id}" \
              | jq -r '.status'
            )"

            if [ "${status}" = "completed" ]; then
              echo "Legacy Pages run completed."
              exit 0
            fi

            sleep 2
          done

          echo "Legacy Pages run is still active; proceeding with compiled deployment."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
