name: One-time Outdoor Services Cleanup

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/cleanup-outdoor-services.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove legacy landscaping identifiers
        shell: bash
        run: |
          set -euo pipefail
          sed -i 's#"/landscaping#"/outdoor-services#g; s#label: "Landscaping"#label: "Outdoor Services"#g' src/shared/components/DebugToolbar.tsx
          rm .github/workflows/cleanup-outdoor-services.yml
          python3 .github/cleanup-outdoor-services.py

      - name: Install frontend dependencies
        run: npm install

      - name: Validate frontend
        run: npm run build

      - name: Install server dependencies
        working-directory: server
        run: npm install

      - name: Validate server
        working-directory: server
        run: npm run build

      - name: Commit cleanup to main
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/cleanup-outdoor-services.py
          git config user.name "Del-985"
          git config user.email "119140366+Del-985@users.noreply.github.com"
          git add -A
          git commit -m "Remove legacy landscaping identifiers"
          git push origin HEAD:main
