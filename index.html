<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pioneer Legacy Works</title>

  <style>
    :root {
      --navy: #14263D;
      --navy-light: #1E3A5A;
      --brass: #C79A3B;
      --brass-light: #E0BB68;
      --ivory: #F6F3EC;
      --white: #FFFFFF;
      --charcoal: #202A33;
      --slate: #64707C;
      --border: #D8D3C8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: var(--ivory);
      color: var(--charcoal);
    }

    .navbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1rem 2rem;
      background: var(--navy);
      border-bottom: 3px solid var(--brass);
    }

    .navbar-brand {
      color: var(--white);
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: 0.02em;
      text-decoration: none;
    }

    .navbar-nav {
      display: flex;
      gap: 1.75rem;
      list-style: none;
    }

    .navbar-nav a {
      color: var(--white);
      font-weight: 600;
      text-decoration: none;
      transition: color 0.2s ease;
    }

    .navbar-nav a:hover,
    .navbar-nav a:focus {
      color: var(--brass-light);
    }
  </style>
</head>
<body>
  <header>
    <nav class="navbar" aria-label="Main navigation">
      <a class="navbar-brand" href="index.html">Pioneer Legacy Works</a>

      <ul class="navbar-nav">
        <li><a href="#about">About</a></li>
        <li><a href="#contact">Contact</a></li>
        <li><a href="#companies">Companies</a></li>
      </ul>
    </nav>
  </header>
</body>
</html>
