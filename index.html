      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #ffffff;
      color: #1f1f1f;
    }

    .navbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1rem 2rem;
      border-bottom: 1px solid #dddddd;
      background: #ffffff;
    }

    .navbar-brand {
      color: inherit;
      font-size: 1.25rem;
      font-weight: 700;
      text-decoration: none;
    }

    .navbar-nav {
      display: flex;
      gap: 1.5rem;
      list-style: none;
    }

    .navbar-nav a {
      color: inherit;
      font-weight: 500;
      text-decoration: none;

    .navbar-nav a:hover,
    .navbar-nav a:focus {
      text-decoration: underline;
